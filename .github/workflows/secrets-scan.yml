name: Secrets Scan (Gitleaks)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # nécessaire pour publier le rapport dans l'onglet "Security"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo (historique complet)
        uses: actions/checkout@v4
        with:
          # Gitleaks scanne aussi l'historique des commits, pas seulement
          # l'état actuel des fichiers : un secret supprimé aujourd'hui mais
          # présent dans un ancien commit reste une fuite réelle.
          fetch-depth: 0

      - name: Scan Gitleaks
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
              --source /repo \
              --report-format sarif \
              --report-path /repo/reports/gitleaks-report.sarif \
              --redact \
              --exit-code 1
        continue-on-error: true
        id: gitleaks_scan

      - name: Upload du rapport en artefact CI (conservé même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.sarif
          retention-days: 30

      - name: Publication dans l'onglet Security (code scanning)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks-report.sarif

      - name: Échec du job si un secret a été détecté
        if: steps.gitleaks_scan.outcome == 'failure'
        run: |
          echo "::error::Gitleaks a détecté au moins un secret potentiel. Voir l'onglet Security > Code scanning, ou l'artefact 'gitleaks-report'."
          exit 1
